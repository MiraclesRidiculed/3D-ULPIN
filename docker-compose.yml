services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vcad
      POSTGRES_USER: vcad
      POSTGRES_PASSWORD: vcad
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcad -d vcad"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://vcad:vcad@db:5432/vcad
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
